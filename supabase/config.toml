project_id = "blipchat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://blipchat-room.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/**",
  "https://blipchat-room.vercel.app",
  "https://blipchat-room.vercel.app/**",
  # Vercel preview deployments for this project only.
  "https://blipchat-room-*-akss-projects.vercel.app/**",
]
enable_signup = true
enable_anonymous_sign_ins = true

[realtime]
enabled = true

# `supabase config push` sends this whole file, so anything left unset is pushed
# as the CLI's local-development default rather than being left alone remotely.
# These blocks pin the settings that would otherwise be silently weakened on the
# hosted project. The app itself is anonymous-only and uses none of them, but
# they matter the moment email auth is switched on.
[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
